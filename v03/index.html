<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>App Locale – V03 (archivio)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* V03 prototipo – App Locale (Alessandro & Giovanni)
   Demo: 1 utente reale + utenti e conversazioni di esempio attorno a Richmond.
   Tutto salvato nel browser (localStorage). */
:root{--bg:#fff;--ink:#14202b;--mute:#6b7785;--line:#e6e9ed;--acc:#e5484d;--news:#2f6fe4;--me:#1677ff;--soft:#f3f5f7;--ok:#30a46c;--tab:64px}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;z-index:1}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:0 16px;color:inherit;background:none}
input,textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
textarea{resize:none;min-height:84px}
:focus-visible{outline:3px solid var(--me);outline-offset:2px}
.hide{display:none!important}

/* barra in alto (mappa) */
.top{position:fixed;z-index:10;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:8px;align-items:center}
.place{flex:1;background:#fff;border-radius:16px;padding:9px 14px;box-shadow:0 4px 18px rgba(0,0,0,.12);text-align:left;min-height:56px;display:block}
.place b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:46px;height:46px;padding:0;border-radius:50%;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12);display:grid;place-items:center;flex:none}
.round svg{width:21px;height:21px}
.round.on{background:var(--ink);color:#fff}
.sim{position:fixed;z-index:10;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 76px);background:var(--ink);color:#fff;font-size:13px;padding:6px 12px;border-radius:99px;white-space:nowrap}

/* foglio mappa */
.sheet{position:fixed;z-index:10;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);padding:8px 16px 10px;max-height:44vh;display:flex;flex-direction:column}
.grab{display:block;width:100%;min-height:22px;padding:0;margin:-4px 0 2px;border-radius:0}.grab::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:#cfd5dc;margin:0 auto}
.sheet>*{flex:none}.sheet>.list{flex:1 1 auto;min-height:0}
.sheet.min .scroll-x,.sheet.min .list{display:none}
.h{font-size:17px;font-weight:700;margin:6px 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h span{font-weight:400;color:var(--mute);font-size:13px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.pc{flex:none;background:var(--soft);border-radius:14px;padding:8px 12px;text-align:left;min-width:150px;max-width:200px}
.pc b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{overflow-y:auto;flex:1;margin:0 -16px;padding:0 16px}
.ask{margin-top:8px;background:var(--acc);color:#fff;font-weight:600;width:100%;min-height:48px;font-size:17px}

/* tab bar */
.tabs{position:fixed;z-index:15;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mute);padding:0;position:relative}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs svg{width:24px;height:24px}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--acc);color:#fff;font-size:11px;font-weight:700;border-radius:99px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}

/* viste a schermo intero */
.view{position:fixed;z-index:12;left:0;right:0;top:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));background:#fff;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 24px}
.view h1{font-size:30px;line-height:1.1;margin:4px 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;background:var(--soft);font-size:14px}
.chip.on{background:var(--ink);color:#fff}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 10px;background:#fff}
.who{display:flex;align-items:center;gap:8px;font-size:14px}
.who b{font-weight:600}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.av.lg{width:64px;height:64px;font-size:24px}
.meta{font-size:13px;color:var(--mute)}
.ptxt{margin:8px 0 6px;font-weight:600;font-size:16px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:#fdeaea;color:var(--acc);white-space:nowrap}
.tag.news{background:#e8effd;color:var(--news)}
.tag.cat{background:var(--soft);color:var(--ink);font-weight:500}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row>div{flex:1}
.row:last-child{border-bottom:0}
.sec-t{font-size:13px;font-weight:600;color:var(--mute);margin:22px 0 4px}
.box2{background:var(--soft);border-radius:16px;padding:4px 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--soft);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px}
.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.pri{background:var(--ink);color:#fff;font-weight:600}
.sec{background:var(--soft)}
.red{color:#c0392b}
.phase{display:inline-block;font-size:11px;font-weight:600;color:#8a5a00;background:#fff1d6;padding:2px 8px;border-radius:99px;vertical-align:middle}
.sw{width:50px;height:30px;min-height:30px;border-radius:99px;background:#d5dae0;position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}

/* modale */
.modal{position:fixed;z-index:20;inset:0;background:rgba(10,20,30,.38);display:flex;align-items:flex-end}
.mbox{background:#fff;width:100%;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px)}
@media(min-width:700px){.modal{align-items:center;justify-content:center}.mbox{max-width:520px;border-radius:20px}.sheet{left:16px;right:auto;width:400px;bottom:calc(var(--tab) + 16px);border-radius:20px;max-height:62vh}.view{padding-inline:max(16px,calc(50% - 300px))}}
.mbox h3{margin:6px 0 4px;font-size:21px;line-height:1.25}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;font-size:14px;color:var(--mute);padding:0 6px}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
.btns{display:flex;gap:8px;margin-top:14px}
.btns>button{flex:1}
.ans{padding:10px 12px;background:var(--soft);border-radius:14px;margin:8px 0}
.ans.best{background:#e9f7ef;border:1px solid #bfe5cf}
.ans p{margin:6px 0}
.acts{display:flex;gap:4px;margin-top:4px}
.acts button{min-height:34px;padding:0 10px;font-size:13px;border-radius:99px;background:#fff}
.acts button.on{background:var(--ink);color:#fff}
.near{font-size:11px;font-weight:600;color:var(--ok);background:#e9f7ef;border-radius:99px;padding:1px 7px}
.warn{font-size:13px;color:#8a5a00;background:#fff4e0;border-radius:10px;padding:8px 10px;margin-top:10px}
.rep{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.rep button{background:var(--soft);font-size:14px;min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:4px 10px;font-size:14px;margin-top:8px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.toast{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top) + 118px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.demo{font-size:12px;color:var(--mute);text-align:center;margin:14px 0 4px}
.empty{color:var(--mute);padding:14px 0;font-size:15px}

/* marker */
.me-pin{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 6px rgba(22,119,255,.2)}
.q-pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center}
.q-pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:14px}
.q-pin.news{background:var(--news)}
.pl{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:5px 10px 5px 7px;box-shadow:0 2px 8px rgba(0,0,0,.22);font:600 12px/1 -apple-system,system-ui,sans-serif;color:var(--ink);white-space:nowrap;transform:translate(-50%,-50%)}
.pl i{width:10px;height:10px;border-radius:50%;background:#9aa4af}
.pl b{background:var(--acc);color:#fff;border-radius:99px;padding:2px 6px;font-size:11px}
.leaflet-control-attribution{font-size:10px}
@media(prefers-reduced-motion:reduce){.toast,.sw::after{transition:none}}
</style>
</head>
<body>
<div id="map" aria-label="Mappa"></div>

<!-- MAPPA -->
<div id="mapUi">
  <div class="top">
    <button class="place" data-act="here"><b id="placeName">Sto cercando la tua posizione…</b><small id="placeSub">Consenti l'accesso alla posizione</small></button>
    <button class="round" data-act="search" aria-label="Cerca un posto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
    <button class="round" id="btnSim" data-act="sim" aria-label="Modalità prova: tocca la mappa per spostarti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="5"/></svg></button>
    <button class="round" data-act="locate" aria-label="Centra sulla mia posizione"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.5 2.6L13 21z"/></svg></button>
  </div>
  <div class="sim hide" id="simBadge">Modalità prova: tocca la mappa per spostarti</div>
  <section class="sheet" id="sheet" aria-label="Intorno a te">
    <button class="grab" data-act="sheet" aria-label="Riduci o espandi il pannello"></button>
    <div class="h">Posti intorno a te <span>stato live</span></div>

    <div class="h">Domande e notizie <span id="count"></span></div>
    <div class="list" id="list"></div>

  </section>
</div>

<section class="view hide" id="v-feed"></section>

<nav class="tabs" aria-label="Sezioni">
  <button data-tab="map" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Mappa</button>
  <button data-tab="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/></svg>Feed</button>
  <button data-tab="groups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c.5-3.3 3-5 6-5s5.5 1.7 6 5M15 14.5c2.6-.3 5 1 5.6 4"/></svg>Gruppi</button>
  <button data-tab="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg>Attività<span class="badge hide" id="badge"></span></button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profilo</button>
</nav>

<div class="modal hide" id="modal" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
const KEY='applocale_v03', M=60e3, H=3600e3;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();

/* ---------- utenti di esempio ---------- */
const U={
  giulia:{n:'Giulia R.',c:'#e5484d',rep:420,b:'Local Hero'},
  mark:{n:'Mark TW10',c:'#2f6fe4',rep:310,b:'Esperto di Richmond'},
  priya:{n:'Priya K.',c:'#8e4ec6',rep:180},
  tom:{n:'Tom (Kew)',c:'#12a594',rep:95},
  sara:{n:'Sara runs',c:'#f76b15',rep:260,b:'Runner'},
  ben:{n:'Ben L.',c:'#3e63dd',rep:60},
  fede:{n:'Fede84',c:'#d6409f',rep:140},
  hannah:{n:'Hannah P.',c:'#0d74ce',rep:75}
};
const REP={tranquillo:{l:'Tranquillo',c:'#30a46c'},affollato:{l:'Affollato',c:'#f76b15'},coda:{l:'Coda',c:'#e5484d'},
  evento:{l:'Evento',c:'#8e4ec6'},ritardi:{l:'Ritardi',c:'#e5484d'},chiuso:{l:'Chiuso',c:'#6b7785'}};
const CATS={traffico:'Traffico',trasporti:'Trasporti',eventi:'Eventi',natura:'Natura',sport:'Sport',cibo:'Cibo',info:'Info'};

/* ---------- dati demo (tempi relativi ad adesso) ---------- */
function seed(){
  const t=now(), ago=m=>t-m*M;
  const P=(id,name,cat,lat,lng,info,reps)=>({id,name,cat,lat,lng,info,reports:reps.map(([type,m])=>({type,t:ago(m),demo:true}))});
  const places=[
    P('kew','Kew Gardens – Victoria Gate','Giardino botanico',51.4786,-0.2930,[['Tipo','Giardini botanici (UNESCO)'],['Inverno','Evento serale di Natale con biglietti a fascia oraria'],['Consiglio','Entrata a orario: inutile arrivare molto prima']],[['affollato',8],['coda',14],['affollato',22]]),
    P('sheen','Passaggio a livello Sheen Lane','Incrocio',51.4677,-0.2668,[['Tipo','Passaggio a livello vicino a Mortlake'],['Nota','Nelle ore di punta le barriere restano giù a lungo'],['Alternativa','Clifford Avenue / Chalker\'s Corner']],[['coda',5],['coda',11]]),
    P('green','Richmond Green','Parco',51.4613,-0.3063,[['Tipo','Prato pubblico, cricket d\'estate'],['Intorno','Pub, caffè e teatro'],['Consiglio','Nei weekend di sole si riempie dopo pranzo']],[['tranquillo',18]]),
    P('station','Stazione di Richmond','Trasporti',51.4631,-0.3017,[['Linee','District, Overground, South Western Railway'],['Bus','Fermate davanti alla stazione'],['Consiglio','Nei giorni di partita a Twickenham è molto affollata']],[['ritardi',9],['affollato',16]]),
    P('bridge','Richmond Bridge e Riverside','Fiume',51.4572,-0.3071,[['Tipo','Ponte storico sul Tamigi'],['Attenzione','Con l\'alta marea il lungofiume si allaga'],['Consiglio','Prendete la strada sopra quando è allagato']],[['chiuso',28]]),
    P('terrace','Richmond Hill – The Terrace','Panorama',51.4545,-0.3020,[['Tipo','Belvedere sul Tamigi'],['Curiosità','Vista protetta da una legge del 1902'],['Consiglio','Bellissima al tramonto']],[]),
    P('park','Richmond Park – Pembroke Lodge','Parco',51.4446,-0.2925,[['Tipo','Parco reale con cervi'],['Attenzione','Tenersi a distanza dai cervi, soprattutto in autunno'],['Vista','Da King Henry\'s Mound si vede St Paul\'s']],[['tranquillo',35]]),
    P('twick','Twickenham Stadium','Sport',51.4560,-0.3415,[['Tipo','Stadio del rugby'],['Giorni di partita','Treni e strade pieni da ore prima'],['Consiglio','Meglio arrivare a piedi da Twickenham']],[]),
    P('putney','Putney High Street','Strada',51.4610,-0.2165,[['Tipo','Via dei negozi vicino al ponte di Putney'],['Bus','Molte linee verso il centro'],['Consiglio','Ore di punta lente verso il ponte']],[['affollato',12]])
  ];
  const A=(by,text,m,d,votes=0,best=false)=>({id:uid(),by,text,t:ago(m),d,votes,voted:false,best,demo:true});
  const Q=(type,cat,placeId,by,text,m,expH,answers,votes=0)=>{const p=places.find(x=>x.id===placeId);
    return{id:uid(),type,cat,placeId,lat:p.lat+(Math.random()-.5)*.0008,lng:p.lng+(Math.random()-.5)*.0012,place:p.name,by,text,t:ago(m),exp:ago(m)+expH*H,radius:1000,answers,votes,voted:false,follow:false,demo:true}};
  const posts=[
    Q('q','eventi','kew','priya','Perché c\'è così tanta coda alla Victoria Gate?',25,3,[A('tom','È l\'evento di Natale: si entra per fascia oraria, la coda scorre in una decina di minuti.',19,60,12,true),A('giulia','Se avete il biglietto per un orario più tardi non serve arrivare adesso.',12,140,5)],9),
    Q('n','traffico','sheen','ben','Barriere giù da 12 minuti, coda fino a Upper Richmond Road',8,1,[A('hannah','Confermo, meglio girare da Clifford Avenue.',4,220,3)],6),
    Q('q','eventi','green','fede','Cosa succede sul Green stasera? Si sente musica',40,3,[A('mark','Prove del concerto di Natale della scuola, finiscono verso le 19.',31,90,4,true)],3),
    Q('n','trasporti','station','mark','District line sospesa verso Turnham Green: bus sostitutivi davanti alla stazione',15,2,[A('priya','I bus sostitutivi passano circa ogni 10 minuti.',9,40,2)],11),
    Q('q','natura','park','sara','Cervi vicino al sentiero di Pembroke Lodge: si passa tranquilli?',62,3,[A('priya','Sì, ma restate a 50 m: in questo periodo i maschi sono nervosi.',50,300,7,true),A('ben','Cani al guinzaglio, mi raccomando.',41,500,2)],5),
    Q('q','sport','twick','priya','Sabato c\'è partita? Vorrei evitare il treno',170,24,[A('mark','Sì, nel pomeriggio: treni pieni da mezzogiorno, meglio la mattina.',150,700,6)],4),
    Q('n','info','bridge','giulia','Riverside allagato con l\'alta marea, passate dalla strada sopra',30,3,[A('tom','Grazie, salvato le scarpe!',22,80,1)],8),
    Q('q','cibo','putney','hannah','Qualche posto aperto per un caffè dopo le 18 qui vicino?',20,3,[A('fede','Un paio di caffè sulla High Street chiudono alle 19, i pub servono caffè anche più tardi.',14,120,3)],2),
    Q('q','info','terrace','tom','Com\'è la visibilità dalla terrazza adesso?',48,3,[A('giulia','Un po\' di foschia sul fiume, ma il tramonto si vede bene.',35,30,4,true)],3),
    Q('n','eventi','putney','ben','Mercatino di Natale davanti alla chiesa fino alle 20',55,5,[],5)
  ];

  const groups=[

else{ // sposta i dati demo in avanti, così sembrano sempre "live"
  const d=now()-db.seededAt;

/* ---------- utilità ---------- */
function dist(a,b){const R=6371000,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmtD=m=>m<1000?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(m<10000?1:0).replace('.',',')+' km';
function ago(t){const s=(now()-t)/1000;if(s<60)return'adesso';if(s<3600)return Math.floor(s/60)+' min fa';if(s<86400)return Math.floor(s/3600)+' h fa';return Math.floor(s/86400)+' g fa'}
function left(t){const m=(t-now())/M;return m<60?Math.max(1,Math.round(m))+' min':Math.round(m/60)+' h'}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2400)}
const alive=()=>db.posts.filter(p=>p.exp>now());
const meU=()=>({n:db.me.anon?'Anonimo':db.me.name,c:'#14202b'});
const user=id=>id==='me'?meU():U[id];
const ini=n=>n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const av=(id,cls='')=>{const u=user(id);return`<span class="av ${cls}" style="background:${u.c}">${esc(ini(u.n))}</span>`};
const placeOf=p=>db.places.find(x=>x.id===p.placeId);
function status(pl){const r=pl.reports.filter(x=>now()-x.t<60*M);if(!r.length)return null;
  const c={};r.forEach(x=>c[x.type]=(c[x.type]||0)+1);const type=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
  return{type,n:r.length,last:Math.max(...r.map(x=>x.t))}}
const stHtml=pl=>{const s=status(pl);return s?`<span class="st" style="color:${REP[s.type].c}"><i style="background:${REP[s.type].c}"></i>${REP[s.type].l}</span>`:'<span class="st" style="color:var(--mute)"><i style="background:#c3cad2"></i>Nessuna segnalazione</span>'};
const myPoints=()=>{let p=0;db.posts.forEach(x=>{if(x.by==='me')p+=5+x.votes*2;x.answers.forEach(a=>{if(a.by==='me')p+=10+a.votes*2+(a.best?15:0)})});return p};

/* ---------- mappa ---------- */
const map=L.map('map',{zoomControl:false}).setView([51.4613,-0.3063],14);
let tileErr=0,switched=false;
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
osm.on('tileerror',()=>{if(++tileErr>4&&!switched){switched=true;map.removeLayer(osm);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map)}});
const layer=L.layerGroup().addTo(map);
const meIcon=L.divIcon({className:'',html:'<div class="me-pin"></div>',iconSize:[18,18],iconAnchor:[9,9]});
let me=null,meMarker=null,accCircle=null,simMode=false,gpsPos=null,followed=false,placeLabel='Posizione attuale',lastLook=null;

function setMe(lat,lng,acc,sim){
  me={lat,lng};
  if(!meMarker){meMarker=L.marker([lat,lng],{icon:meIcon,zIndexOffset:1000}).addTo(map);accCircle=L.circle([lat,lng],{radius:acc||30,color:'#1677ff',weight:1,fillOpacity:.08,interactive:false}).addTo(map)}
  else{meMarker.setLatLng([lat,lng]);accCircle.setLatLng([lat,lng])}
  accCircle.setRadius(sim?15:Math.min(acc||30,300));
  if(!followed){followed=true;
    const far=dist(me,{lat:51.4613,lng:-0.3063})>20000;
    if(far)toast('Sei lontano da Richmond: i dati di esempio sono lì (usa la lente)');
    map.setView([lat,lng],far?15:14);map.panBy([0,150],{animate:false})}
  lookup(lat,lng);renderMapUi();
}
async function lookup(lat,lng){
  if(lastLook&&dist(lastLook,{lat,lng})<60)return;lastLook={lat,lng};
  $('#placeSub').textContent=lat.toFixed(4)+', '+lng.toFixed(4);
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=17&accept-language=it`);
    const j=await r.json(),a=j.address||{};
    const name=j.name||a.road||a.pedestrian||a.neighbourhood||a.suburb||'Posizione attuale';
    const area=[a.suburb||a.neighbourhood,a.city||a.town||a.village].filter(Boolean).join(', ');
    $('#placeName').textContent=name;$('#placeSub').textContent=area||'';placeLabel=name+(area?' · '+area:'');
  }catch(e){$('#placeName').textContent='Posizione attuale'}
}
if('geolocation' in navigator){
  navigator.geolocation.watchPosition(p=>{gpsPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};if(!simMode)setMe(gpsPos.lat,gpsPos.lng,gpsPos.acc)},
    ()=>{$('#placeName').textContent='Posizione non disponibile';$('#placeSub').textContent='Usa ⊕ e tocca la mappa per scegliere dove sei'},
    {enableHighAccuracy:true,maximumAge:10000,timeout:15000});
}
map.on('click',e=>{if(simMode)setMe(e.latlng.lat,e.latlng.lng,15,true)});

function renderMap(){
  layer.clearLayers();
  const live=alive();
  db.places.forEach(pl=>{
    const n=live.filter(p=>p.placeId===pl.id).length,s=status(pl);
    const ic=L.divIcon({className:'',html:`<div class="pl"><i style="background:${s?REP[s.type].c:'#9aa4af'}"></i>${esc(pl.name.split(' – ')[0])}${n?`<b>${n}</b>`:''}</div>`,iconSize:[0,0]});
    L.marker([pl.lat,pl.lng],{icon:ic}).on('click',()=>openPlace(pl.id)).addTo(layer);
  });
  live.filter(p=>!p.placeId).forEach(p=>{
    L.circle([p.lat,p.lng],{radius:p.radius,color:p.type==='n'?'#2f6fe4':'#e5484d',weight:1,fillOpacity:.04,interactive:false}).addTo(layer);
    const ic=L.divIcon({className:'',html:`<div class="q-pin ${p.type==='n'?'news':''}"><span>${p.type==='n'?'!':'?'}</span></div>`,iconSize:[30,30],iconAnchor:[15,30]});

  });
}

  openModal(`<h3>${pl?'Chiedi a chi è lì':'Cosa succede qui?'}</h3><div class="meta">📍 ${esc(pl?pl.name:placeLabel)}</div>
    <form id="askForm">
    <div class="seg" data-name="type" style="margin-top:12px"><button type="button" class="on" data-v="q">Domanda</button><button type="button" data-v="n">Notizia</button></div>
    <textarea id="askText" maxlength="280" placeholder="Es. Perché c'è così tanta gente?" style="margin-top:10px" required>${esc(text||'')}</textarea>
    <label>Categoria</label>
    <div class="chips" data-name="cat" style="margin:0 -16px">${Object.entries(CATS).map(([k,l],i)=>`<button type="button" class="chip ${k==='info'?'on':''}" data-v="${k}">${l}</button>`).join('')}</div>
    <label>Chi può rispondere</label>
    <div class="seg" data-name="radius"><button type="button" data-v="300">300 m</button><button type="button" class="on" data-v="1000">1 km</button><button type="button" data-v="5000">5 km</button></div>
    <label>Scade dopo</label>
    <div class="seg" data-name="exp"><button type="button" data-v="1">1 ora</button><button type="button" class="on" data-v="3">3 ore</button><button type="button" data-v="24">24 ore</button></div>
    <div class="meta" style="margin-top:10px">Pubblichi come <b>${esc(meU().n)}</b> · cambia in Profilo</div>
    <div class="btns"><button type="button" class="sec" data-close>Annulla</button><button class="pri">Pubblica</button></div></form>`,'ask');
  const f=$('#askForm');
  f.onsubmit=e=>{e.preventDefault();const t=$('#askText').value.trim();if(!t)return;
    const v=n=>f.querySelector(`[data-name="${n}"] .on`).dataset.v;
    const base=pl||me;
    const p={id:uid(),type:v('type'),cat:v('cat'),placeId:pl?pl.id:null,lat:base.lat,lng:base.lng,place:pl?pl.name:placeLabel,by:'me',text:t,
      t:now(),exp:now()+(+v('exp'))*H,radius:+v('radius'),answers:[],votes:0,voted:false,follow:true};
    db.posts.push(p);save();toast('Pubblicata ✓ Avvisiamo chi è in zona');openThread(p.id);render();simulateReply(p.id);
  };
  setTimeout(()=>$('#askText').focus(),60);
}

function openThread(id){
  const p=db.posts.find(x=>x.id===id);if(!p)return;
  const u=user(p.by),d=me?dist(me,p):null,inside=d!=null&&d<=p.radius;
  const answers=p.answers.slice().sort((a,b)=>(b.best-a.best)||(b.votes-a.votes)||(a.t-b.t));
  const draft=$('#ansText')&&openId===id?$('#ansText').value:'';
  openModal(`<div class="who">${av(p.by)}<div><b>${esc(u.n)}</b><div class="meta">${ago(p.t)} · scade tra ${left(p.exp)}</div></div></div>
    <div style="margin-top:10px"><span class="tag ${p.type==='n'?'news':''}">${p.type==='n'?'Notizia':'Domanda'}</span> <span class="tag cat">${esc(CATS[p.cat]||'Info')}</span></div>
    <h3>${esc(p.text)}</h3>
    <div class="meta">📍 ${p.placeId?`<a href="#" data-act="place" data-id="${p.placeId}">${esc(p.place)}</a>`:esc(p.place)} · zona ${fmtD(p.radius)}</div>
    <div class="acts" style="margin-top:8px"><button class="${p.voted?'on':''}" data-act="voteP" data-id="${p.id}">▲ Utile ${p.votes}</button><button class="${p.follow?'on':''}" data-act="follow" data-id="${p.id}">${p.follow?'Segui ✓':'Segui'}</button>${p.by!=='me'?`<button data-act="flag" data-id="${p.by}">Segnala</button>`:`<button class="red" data-act="del" data-id="${p.id}">Elimina</button>`}</div>
    <label>${answers.length} rispost${answers.length===1?'a':'e'}</label>
    ${answers.length?answers.map(a=>{const au=user(a.by),near=a.d<=p.radius;return`<div class="ans ${a.best?'best':''}">
      <div class="who">${av(a.by)}<b>${esc(au.n)}</b>${near?'<span class="near">Era lì</span>':''}${a.best?'<span class="near">Migliore</span>':''}</div>
      <p>${esc(a.text)}</p><div class="meta">da ${fmtD(a.d)} dal posto · ${ago(a.t)}${a.sim?' · risposta simulata':''}</div>
      <div class="acts"><button class="${a.voted?'on':''}" data-act="voteA" data-id="${p.id}" data-v="${a.id}">▲ Utile ${a.votes}</button>
      ${p.by==='me'&&!a.best&&a.by!=='me'?`<button data-act="best" data-id="${p.id}" data-v="${a.id}">Segna migliore</button>`:''}
      ${a.by!=='me'?`<button data-act="flag" data-id="${a.by}">Segnala</button>`:''}</div></div>`}).join(''):'<p class="empty">Ancora nessuna risposta. Chi è in zona riceve un avviso.</p>'}
    <label for="ansText">Rispondi ${d!=null?'(sei a '+fmtD(d)+')':''}</label>
    <textarea id="ansText" maxlength="280" placeholder="Scrivi cosa vedi da lì">${esc(draft)}</textarea>
    ${inside?'':'<div class="warn">Sei fuori dalla zona: nell\'app vera la tua risposta non avrebbe il bollino “Era lì”. Con ⊕ puoi simulare di essere lì.</div>'}
    <div class="btns"><button class="sec" data-close>Chiudi</button><button class="pri" data-act="sendAns" data-id="${p.id}">Invia risposta</button></div>`,'thread');
  openId=id;
}

function openGroup(id){
  const g=db.groups.find(x=>x.id===id);if(!g)return;
  openModal(`<div class="who"><span class="av lg" style="background:${g.c};border-radius:16px">${esc(ini(g.name))}</span><div><h3 style="margin:0">${esc(g.name)}</h3><div class="meta">${g.members+(g.joined?1:0)} membri</div></div></div>
    <p>${esc(g.desc)}</p>
    <button class="${g.joined?'sec':'pri'}" style="width:100%" data-act="join" data-id="${g.id}">${g.joined?'Esci dal gruppo':'Unisciti al gruppo'}</button>
    <label>Discussioni</label>
    ${g.posts.slice().sort((a,b)=>b.t-a.t).map(x=>`<div class="ans"><div class="who">${av(x.by)}<b>${esc(user(x.by).n)}</b><span class="meta">${ago(x.t)}</span></div><p>${esc(x.text)}</p><div class="meta">${x.replies} rispost${x.replies===1?'a':'e'}</div></div>`).join('')}
    ${g.joined?`<label for="gText">Scrivi nel gruppo</label><textarea id="gText" maxlength="280" placeholder="Apri una discussione"></textarea>
    <div class="btns"><button class="sec" data-close>Chiudi</button><button class="pri" data-act="gPost" data-id="${g.id}">Pubblica</button></div>`:'<div class="btns"><button class="sec" data-close>Chiudi</button></div>'}
    <p class="demo">Gruppo di esempio</p>`,'group');
  openId=id;
}

function openSearch(){
  openModal(`<h3>Cerca un posto</h3><input id="q" placeholder="Es. Kew, stazione, parco" autocomplete="off">
    <div id="qres" style="margin-top:8px"></div><div class="btns"><button class="sec" data-close>Chiudi</button></div>`,'search');
  const draw=()=>{const q=$('#q').value.trim().toLowerCase();
    const r=withD(db.places).filter(p=>!q||(p.name+' '+p.cat).toLowerCase().includes(q)).sort((a,b)=>(a.d??0)-(b.d??0));
    $('#qres').innerHTML=r.map(p=>`<div class="row" data-act="place" data-id="${p.id}" style="cursor:pointer"><div><b>${esc(p.name)}</b><div class="meta">${esc(p.cat)}${p.d!=null?' · '+fmtD(p.d):''}</div></div>${stHtml(p)}</div>`).join('')||'<p class="empty">Nessun posto trovato</p>'};
  $('#q').oninput=draw;draw();setTimeout(()=>$('#q').focus(),60);
}

/* ---------- risposta simulata (per sentire l'app "viva") ---------- */
function simulateReply(id){
  setTimeout(()=>{
    const p=db.posts.find(x=>x.id===id);if(!p||p.exp<now())return;
    const t=p.text.toLowerCase(),ids=Object.keys(U),by=ids[Math.floor(Math.random()*ids.length)];
    const text=/cod|traffic|fila|barrier/.test(t)?'Sono qui vicino: lavori stradali al semaforo, si passa a senso alternato. Ci vogliono 5-10 minuti.'
      :/gente|folla|pien|affoll/.test(t)?'C\'è un evento qui vicino, finisce tra un\'ora circa. Dopo dovrebbe svuotarsi.'
      :/apert|chius|orari/.test(t)?'Ci sono passato 10 minuti fa: aperto.'
      :/parchegg/.test(t)?'Qualche posto libero nelle vie laterali, il parcheggio principale è pieno.'
      :/treno|bus|metro|district|stazion/.test(t)?'Treni regolari adesso, qualche minuto di ritardo prima.'
      :'Sono qui vicino: al momento tutto tranquillo.';
    const d=Math.round(40+Math.random()*Math.min(p.radius,600));
    p.answers.push({id:uid(),by,text,t:now(),d,votes:0,voted:false,best:false,sim:true});
    db.notifs.push({id:uid(),text:`${U[by].n} ha risposto: “${p.text.slice(0,50)}”`,t:now(),read:false,post:p.id});
    save();toast(`Nuova risposta da ${U[by].n}`);
    if(modalKind==='thread'&&openId===id)openThread(id);render();
  },6000+Math.random()*5000);
}

/* ---------- azioni ---------- */
const actions={
  thread:id=>openThread(id),place:id=>openPlace(id),group:id=>openGroup(id),
  ask:()=>openAsk(null),askPlace:(id,v)=>openAsk(id,v),search:()=>openSearch(),
  here:()=>{if(!me){toast('Posizione non ancora trovata');return}
    const n=withD(db.places).sort((a,b)=>a.d-b.d)[0];if(n&&n.d<400)openPlace(n.id);else openAsk(null)},
  locate:()=>{if(me)map.setView([me.lat,me.lng],16);else toast('Posizione non ancora trovata')},
  sim:()=>{simMode=!simMode;$('#btnSim').classList.toggle('on',simMode);$('#simBadge').classList.toggle('hide',!simMode);
    if(!simMode&&gpsPos)setMe(gpsPos.lat,gpsPos.lng,gpsPos.acc);toast(simMode?'Tocca la mappa per spostarti':'Torno al GPS')},
  sheet:()=>$('#sheet').classList.toggle('min'),
  tab:id=>{closeModal();setTab(id)},
  feedF:id=>{feedF=id;render()},feedCat:id=>{feedCat=id;render()},
  readAll:()=>{db.notifs.forEach(n=>n.read=true);save();render()},
  report:(id,v)=>{const pl=db.places.find(x=>x.id===id);pl.reports.push({type:v,t:now()});save();toast('Grazie! Segnalazione “'+REP[v].l+'” aggiunta');openPlace(id);render()},
  voteP:id=>{const p=db.posts.find(x=>x.id===id);p.voted=!p.voted;p.votes+=p.voted?1:-1;save();openThread(id);render()},
  voteA:(id,v)=>{const p=db.posts.find(x=>x.id===id),a=p.answers.find(x=>x.id===v);a.voted=!a.voted;a.votes+=a.voted?1:-1;save();openThread(id)},
  best:(id,v)=>{const p=db.posts.find(x=>x.id===id);p.answers.forEach(a=>a.best=a.id===v);save();toast('Risposta migliore segnata: +15 punti a chi ha risposto');openThread(id)},
  follow:id=>{const p=db.posts.find(x=>x.id===id);p.follow=!p.follow;save();toast(p.follow?'Ricevi un avviso per ogni nuova risposta':'Non segui più');openThread(id)},
  flag:by=>openModal(`<h3>Segnala ${esc(user(by).n)}</h3><p class="meta">Nell'app vera la segnalazione va ai moderatori. Obbligatorio per l'App Store.</p>
    ${['Informazione falsa','Spam o pubblicità','Offensivo','Rivela dove si trova una persona'].map(r=>`<div class="row" data-act="flagged" data-id="${by}" style="cursor:pointer"><div>${r}</div></div>`).join('')}
    <div class="row" data-act="block" data-id="${by}" style="cursor:pointer"><div class="red"><b>Blocca questo utente</b></div></div>
    <div class="btns"><button class="sec" data-close>Annulla</button></div>`),
  flagged:()=>{closeModal();toast('Segnalazione inviata (demo)')},
  block:by=>{db.blocked=db.blocked||[];if(!db.blocked.includes(by))db.blocked.push(by);save();closeModal();toast(user(by).n+' bloccato (demo)')},
  del:id=>{db.posts=db.posts.filter(x=>x.id!==id);save();closeModal();render();toast('Eliminata')},
  sendAns:id=>{const t=$('#ansText').value.trim();if(!t)return;const p=db.posts.find(x=>x.id===id);
    p.answers.push({id:uid(),by:'me',text:t,t:now(),d:me?Math.round(dist(me,p)):0,votes:0,voted:false,best:false});
    $('#ansText').value='';save();toast('Risposta inviata: +10 punti');openThread(id);render();
    if(p.by!=='me')setTimeout(()=>{const a=p.answers.find(x=>x.by==='me'&&!x.voted&&x.votes===0);if(a){a.votes++;db.notifs.push({id:uid(),text:`${user(p.by).n} ha trovato utile la tua risposta`,t:now(),read:false,post:p.id});save();render()}},9000)},
  join:id=>{const g=db.groups.find(x=>x.id===id);g.joined=!g.joined;save();toast(g.joined?'Ti sei unito a '+g.name:'Sei uscito dal gruppo');openGroup(id);render()},
  gPost:id=>{const t=$('#gText').value.trim();if(!t)return;const g=db.groups.find(x=>x.id===id);g.posts.push({id:uid(),by:'me',text:t,t:now(),replies:0});save();openGroup(id)},
  fAccept:k=>{db.friends[k]='friend';save();toast('Ora tu e '+U[k].n+' siete amici');render()},
  fDecline:k=>{delete db.friends[k];save();render()},
  fRemove:k=>{delete db.friends[k];save();render()},
  fAdd:k=>{db.friends[k]='sent';save();toast('Richiesta inviata a '+U[k].n);render();
    setTimeout(()=>{if(db.friends[k]==='sent'){db.friends[k]='friend';db.notifs.push({id:uid(),text:U[k].n+' ha accettato la tua richiesta di amicizia',t:now(),read:false,tab:'me'});save();render()}},7000)},
  toggle:k=>{db.me[k]=!db.me[k];save();render()},
  set:(k,v)=>{db.me[k]=v;save();render()},
  areaDel:i=>{db.me.areas.splice(+i,1);save();render()},
  areaAdd:()=>{const n=placeLabel.split(' · ').pop()||'Zona attuale';if(!db.me.areas.includes(n))db.me.areas.push(n);save();render();toast('Segui '+n)},
  reset:()=>openModal(`<h3>Ripristinare la demo?</h3><p class="meta">Cancella domande, risposte, amici e impostazioni salvati su questo telefono.</p>
    <div class="btns"><button class="sec" data-close>Annulla</button><button class="pri" data-act="resetOk">Ripristina</button></div>`),
  resetOk:()=>{db=seed();save();closeModal();render();toast('Demo ripristinata')}
};
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
  if(e.target.closest('[data-close]')||e.target.id==='modal'){closeModal();return}
  const sg=e.target.closest('[data-name] [data-v]');if(sg&&sg.type==='button'){sg.parentElement.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===sg));return}
  const nr=e.target.closest('[data-n]');if(nr){const n=db.notifs.find(x=>x.id===nr.dataset.n);if(n&&!n.read){n.read=true;save();render()}}
  const a=e.target.closest('[data-act]');if(!a)return;e.preventDefault();
  const f=actions[a.dataset.act];if(f)f(a.dataset.id,a.dataset.v);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

setInterval(()=>{render();if(modalKind==='thread'&&openId&&!$('#ansText').value)openThread(openId)},60000);
render();
}
</script>
</body>
</html>
